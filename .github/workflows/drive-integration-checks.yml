name: Drive integration tests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  isolated-drive:
    name: Drive handlers and Picker (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, zip, openssl
          coverage: none
      - name: PHP Drive and finishing integration (isolated HTTP and database)
        run: php tools/test-drive-integration.php
      - name: Picker and accessible interaction flows (simulated DOM)
        run: node tools/test-drive-picker.cjs
