name: Finishing syntax checks
on:
  pull_request:
    paths:
      - 'includes/class-sbs-finishing.php'
      - 'includes/class-sbs-google-drive*.php'
      - 'assets/js/finishing.js'
      - 'templates/finishing*.php'
      - 'smutty-bear-studio.php'
      - '.github/workflows/finishing-checks.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l smutty-bear-studio.php
          php -l includes/class-sbs-finishing.php
          php -l includes/class-sbs-google-drive.php
          php -l includes/class-sbs-google-drive-transport.php
          php -l templates/finishing.php
          php -l templates/finishing-settings.php
      - name: JavaScript syntax
        run: node --check assets/js/finishing.js
