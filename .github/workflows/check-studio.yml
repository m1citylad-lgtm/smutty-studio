name: Validate Studio changes
on:
  push:
    branches:
      - 'codex/**'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4.33'
          extensions: zip, openssl, gd, imagick
          coverage: none
      - name: PHP syntax and regression checks
        run: |
          find . -name '*.php' -not -path './build/*' -print0 | xargs -0 -n1 php -l
          php tools/test-development.php
          php tools/test-freestyle.php
          php tools/test-openai-response.php
          php tools/test-settings.php
          php tools/test-updater-rollback.php
          php tools/test-print-qa.php
          php tools/test-review-persistence.php
          php tools/test-finishing-failure.php
          php tools/test-upscale-resume.php
          php tools/test-finishing-flow.php
          php tools/test-finishing-drive.php
          php tools/test-finishing-drive-files.php
          php tools/test-final-print.php
          php tools/test-intake.php
          php -n -d extension=json -d extension=gd -d extension=zip tools/test-print-qa.php
      - name: JavaScript and image export checks
        run: |
          node --check assets/js/studio.js
          node --check assets/js/freestyle.js
          node --check assets/js/finishing.js
          node --check assets/js/logic-correction.js
          node tools/test-logic-correction.cjs
          node tools/test-finishing.cjs
          node --check assets/js/finishing-flow.js
          node tools/test-finishing-flow.cjs
          node --check assets/js/final-print.js
          node tools/test-final-print.cjs
          node --check assets/js/treatment.js
          node tools/test-treatment.cjs
          node tools/test-print-visibility.cjs
          node tools/test-flat-background.cjs
          node tools/test-development.cjs
          node tools/test-freestyle.cjs
          node tools/test-export.cjs
          node tools/test-png-resolution.cjs


  guided-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/sbs-ui" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/sbs-ui/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify the guided screen and actual button sequence
        env:
          NODE_PATH: ${{ runner.temp }}/sbs-ui/node_modules
        run: node tools/test-finishing-flow-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guided-finishing-ui
          path: build/ui-check/
