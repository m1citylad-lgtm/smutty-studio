name: Publish plugin release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '**/*.md'

permissions:
  contents: write

concurrency:
  group: smutty-studio-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4.33'
          extensions: zip, openssl, gd, imagick
          coverage: none

      - name: Validate source and regression checks
        run: |
          find . -name '*.php' -not -path './build/*' -print0 | xargs -0 -n1 php -l
          node --check assets/js/studio.js
          node --check assets/js/freestyle.js
          node --check assets/js/finishing.js
          node --check assets/js/logic-correction.js
          node tools/test-logic-correction.cjs
          node tools/test-finishing.cjs
          php tools/test-finishing-delete.php
          node tools/test-flat-background.cjs
          node tools/test-export.cjs
          node tools/test-development.cjs
          php tools/test-development.php
          node tools/test-freestyle.cjs
          php tools/test-freestyle.php
          php tools/test-openai-response.php
          php tools/test-settings.php
          php tools/test-updater-rollback.php
          php tools/test-print-qa.php
          php -n -d extension=json -d extension=gd -d extension=zip tools/test-print-qa.php
          node tools/test-png-resolution.cjs

      - name: Build release
        env:
          SBS_RELEASE_PRIVATE_KEY: ${{ secrets.SBS_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SBS_RELEASE_PRIVATE_KEY" ]]; then
            echo "Missing SBS_RELEASE_PRIVATE_KEY GitHub Actions secret." >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/sbs-release-private.pem"
          printf '%s' "$SBS_RELEASE_PRIVATE_KEY" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          if ! openssl pkey -in "$key_file" -noout >/dev/null 2>&1; then
            echo "SBS_RELEASE_PRIVATE_KEY must contain the base64-encoded PEM key." >&2
            exit 1
          fi
          version="$(sed -n 's/^ \* Version: \([0-9A-Za-z.+-]*\)$/\1/p' smutty-bear-studio.php)"
          echo "version=$version" >> "$GITHUB_ENV"
          export SBS_UPDATE_BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}"
          export SBS_DEFAULT_UPDATE_FEED_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/release-feed.json"
          SBS_RELEASE_PRIVATE_KEY_FILE="$key_file" SBS_RELEASE_KEY_ID="sbs-release-20261026" SBS_REQUIRE_SIGNATURE=1 tools/build-release.sh
          rm -f "$key_file"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package="$(find build/release -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$package"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version already exists; bump the plugin version before publishing." >&2
            exit 1
          fi
          gh release create "v$version" "$package" build/release/release-feed.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Smutty Studio v$version" \
            --generate-notes

      - uses: actions/upload-artifact@v4
        with:
          name: smutty-studio-${{ env.version }}
          path: build/release/
